name: Spring Engine Verification

on:
  pull_request:
    paths:
      - src/physics/**
      - tests/physics/**
      - docs/SPRING_CONTRACT.md
      - package.json
      - package-lock.json
      - .github/workflows/spring-engine.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Frozen install
        run: npm ci

      - name: Strict typecheck
        run: npm run typecheck

      - name: Physics tests
        run: npm run test:physics

      - name: Astro production build
        run: npm run build
